name: ProjectMentor CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x
      - run: dotnet restore backend/ProjectMentor.Api/ProjectMentor.csproj
      - run: dotnet build backend/ProjectMentor.Api/ProjectMentor.csproj --no-restore
      - run: dotnet test backend/ProjectMentor.Tests/ProjectMentor.Tests.csproj

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
