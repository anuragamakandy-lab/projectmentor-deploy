name: projectmentor_mobile
description: Minimal ProjectMentor student workflow client
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_tts: ^4.2.5
  go_router: ^16.1.0
  google_sign_in: 6.2.2
  google_sign_in_web: 0.12.4+4
  http: ^1.6.0
  image_picker: ^1.2.0
  intl: ^0.20.2
  open_filex: ^4.7.0
  path_provider: ^2.1.5
  share_plus: ^12.0.2
  shared_preferences: ^2.5.3
  speech_to_text: ^7.4.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-400.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-500.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-600.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-700.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-800.ttf
          weight: 800
